name: Regenerate clean lockfile

on:
  push:
    branches: ["rebuild/cfs-tutor-v2"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'chore: regenerate clean package lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/cfs-tutor-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate clean package lock"
          git push origin HEAD:rebuild/cfs-tutor-v2
